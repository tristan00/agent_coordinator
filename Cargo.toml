[package]
name = "agent-coordinator"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
default-run = "agent-coordinator"

[[bin]]
name = "recording-adapter"
path = "scripts/recording.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tiny_http = "0.12"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Time"] }
